
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Honeybee AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <h1>🐝 Join Honeybee AI</h1>
            <p class="subtitle">Create your account to analyze honeybee colonies</p>

            <form id="register-form">
                <label for="email">Email address</label>
                <input id="email" type="email" required autocomplete="email">

                <label for="password">Password</label>
                <input id="password" type="password" minlength="8" required autocomplete="new-password">

                <button type="submit" id="register-button">Create account</button>
                <p id="auth-message" role="status"></p>
            </form>

            <p class="auth-link">Already registered? <a href="/login">Sign in</a></p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="{{ url_for('static', filename='supabase-config.js') }}"></script>
    <script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
